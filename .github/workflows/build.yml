name: Windows Build & Installer

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 'c8696863d371ab7f137759bc4410cb45a15d860d'
          runVcpkgInstall: true
          vcpkgJsonGlob: 'vcpkg.json'

      - name: Configure CMake
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release --target EchoesOfTheLost --parallel

      - name: Collect runtime files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item build/Release/EchoesOfTheLost.exe staging/
          Copy-Item -Recurse assets staging/assets
          if (Test-Path "build/vcpkg_installed/x64-windows/bin") {
            Copy-Item build/vcpkg_installed/x64-windows/bin/*.dll staging/ -ErrorAction SilentlyContinue
          }
          if (Test-Path "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin") {
            Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/*.dll" staging/ -ErrorAction SilentlyContinue
          }

      - name: Create installer (Inno Setup)
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.1
        with:
          path: ./installer/EchoesOfTheLost.iss
          options: /O+

      - name: Upload installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: EchoesOfTheLost-Setup
          path: Output/*.exe
          if-no-files-found: error

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Output/*.exe
          generate_release_notes: true
          body: |
            ## Echoes of the Lost - Build automatique

            - Commit : ${{ github.sha }}
            - Installeur complet pour Windows 10/11 x64.
